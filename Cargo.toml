[package]
name = "vibes"
version = "0.1.0"
edition = "2024"
description = "Vibes - Native GPUI Internet Radio & Audio-Only YouTube Player for KDE Plasma"
license = "MIT"

[[bin]]
name = "vibes"
path = "src/main.rs"

[dependencies]
gpui-kit = "0.10.0"
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
ureq = "3"
async-channel = "2"
async-io = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.25"
image = "0.25"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
percent-encoding = "2"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
cosmic-text = "0.19"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
